# Tests and drift check of the stubs (composer test: PHPUnit including tests/SignaturesTest.php).
#
# composer.lock is not committed, so every pipeline installs the newest shopware/core of the supported minor
# (require-dev "~6.7.0"). A weekly pipeline schedule therefore reports when a Shopware release changes a member this
# package stubs (bin/stub-signatures check). Once a second Shopware minor gets stubs, this job needs one variant per
# minor (and signatures.json one snapshot per minor).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

test:
  # A PHP version Psalm supports. Not the composer image: it follows the newest PHP (8.6 since 11/2026), which Psalm 6
  # does not install on.
  image: php:8.3-cli-alpine
  tags: [ test ]
  variables:
    COMPOSER_ALLOW_SUPERUSER: '1'
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache
  cache:
    key: composer
    paths:
      - .composer-cache
  before_script:
    - apk add --no-cache git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --2 --install-dir=/usr/local/bin --filename=composer --quiet
    # GitHub token for the dist downloads (60 requests per hour and IP without one), optional
    - if [ -n "$GITHUB_TOKEN" ]; then composer --no-plugins config --global github-oauth.github.com "$GITHUB_TOKEN"; fi
  script:
    # The PHP extensions of Shopware are not needed: the tests only parse and analyse its code
    - composer install --no-interaction --no-progress --ignore-platform-req='ext-*'
    - composer show shopware/core | grep -E '^versions'
    - composer test
